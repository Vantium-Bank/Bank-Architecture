<!DOCTYPE html>
<html>
<body style="margin:0; background:#060c18;">
  <iframe id="app" src="/index.html" style="width:1600px; height:1200px; border:none;"></iframe>
  <script>
    const iframe = document.getElementById('app');
    iframe.onload = () => {
      setTimeout(() => {
        try {
          iframe.contentWindow.selectComponent('sec3_direct_connect');
        } catch(e) {
          console.error(e);
        }
      }, 1000);
    };
  </script>
</body>
</html>
